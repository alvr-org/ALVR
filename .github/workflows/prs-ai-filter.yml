name: PRs AI filter

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  prs-ai-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: mshick/add-pr-comment@v3
        with:
          message-id: anti-ai-checks
          message: "Anti-AI checks can be found [here](https://github.com/alvr-org/ALVR/actions/runs/${{ github.run_id }})."

      - uses: peakoss/anti-slop@v0
        with:
          max-failures: 3
          exempt-author-association: ""
          failure-pr-message: "3 or more anti-AI checks failed and the PR is closed. If you want to have a maintainer look at it, ping them with `@alvr-org/maintainers`."
