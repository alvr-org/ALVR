[package]
name = "alvr_client_emulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
alvr_common.workspace = true
alvr_client_core.workspace = true
alvr_packets.workspace = true
alvr_session.workspace = true
alvr_system_info.workspace = true

eframe = { version = "0.35", features = ["wgpu"] }
egui = "0.35"
egui-wgpu = "0.35"
wgpu = "29"
bytemuck = { version = "1", features = ["derive"] }
easy-gltf = "1.1"
env_logger = "0.11"
# Links against the ffmpeg that `cargo xtask prepare-deps` already downloads for the server; see
# build.rs. Note that build is GPL licensed.
ffmpeg-next = "9"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[build-dependencies]
alvr_filesystem = { path = "../filesystem" }
